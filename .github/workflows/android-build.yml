name: Quizzy Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Quizzy
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: |
          mkdir -p www
          rsync -a --exclude '.git' --exclude 'android' --exclude 'www' --exclude 'node_modules' ./ www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Quizzy
        run: npx cap sync android

      - name: Generar AAB de prueba
        working-directory: android
        run: ./gradlew bundleDebug

      - name: Guardar AAB de prueba
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Generar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar clave de firma
        env:
          QUIZZY_KEYSTORE_BASE64: ${{ secrets.QUIZZY_KEYSTORE_BASE64 }}
        run: |
          echo "$QUIZZY_KEYSTORE_BASE64" | base64 --decode > android/quizzy-upload-key.jks

      - name: Generar AAB Release firmado
        env:
          QUIZZY_KEYSTORE_PASSWORD: ${{ secrets.QUIZZY_KEYSTORE_PASSWORD }}
          QUIZZY_KEY_ALIAS: ${{ secrets.QUIZZY_KEY_ALIAS }}
        run: |
          npx cap build android --keystorepath android/quizzy-upload-key.jks --keystorepass "$QUIZZY_KEYSTORE_PASSWORD" --keystorealias "$QUIZZY_KEY_ALIAS" --keystorealiaspass "$QUIZZY_KEYSTORE_PASSWORD" --androidreleasetype AAB

      - name: Guardar AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
