name: Quizzy Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Quizzy
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: |
          mkdir -p www
          rsync -a --exclude '.git' --exclude 'android' --exclude 'www' --exclude 'node_modules' ./ www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar icono oficial de Quizzy
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p www android/app/src/main/res
          convert quizzy-icon-source.webp -resize 192x192! www/quizzy-icon-192.png
          convert quizzy-icon-source.webp -resize 512x512! www/quizzy-icon-512.png
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            pixels="$2"
            target="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target"
            convert quizzy-icon-source.webp -resize "${pixels}x${pixels}!" "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_foreground.png"
          done
          test -s www/quizzy-icon-192.png
          test -s www/quizzy-icon-512.png
          echo "Iconos de Quizzy instalados en web y Android."

      - name: Sincronizar Quizzy
        run: npx cap sync android

      - name: Aumentar número de versión para Google Play
        shell: bash
        run: |
          set -e
          GRADLE_FILE="android/app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: No se encuentra $GRADLE_FILE"
            exit 1
          fi
          sed -i '0,/versionCode 1/s//versionCode 6/' "$GRADLE_FILE"
          grep -n "versionCode" "$GRADLE_FILE"
          grep -q "versionCode 6" "$GRADLE_FILE"

      - name: Generar AAB de prueba
        working-directory: android
        run: ./gradlew bundleDebug

      - name: Guardar AAB de prueba
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Generar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar clave de firma
        env:
          QUIZZY_KEYSTORE_BASE64: ${{ secrets.QUIZZY_KEYSTORE_BASE64 }}
        run: |
          echo "$QUIZZY_KEYSTORE_BASE64" | base64 --decode > android/quizzy-upload-key.jks

      - name: Generar AAB Release firmado
        env:
          QUIZZY_KEYSTORE_PASSWORD: ${{ secrets.QUIZZY_KEYSTORE_PASSWORD }}
          QUIZZY_KEY_ALIAS: ${{ secrets.QUIZZY_KEY_ALIAS }}
        run: |
          npx cap build android --keystorepath quizzy-upload-key.jks --keystorepass "$QUIZZY_KEYSTORE_PASSWORD" --keystorealias "$QUIZZY_KEY_ALIAS" --keystorealiaspass "$QUIZZY_KEYSTORE_PASSWORD" --androidreleasetype AAB

      - name: Refirmar AAB con SHA-256 para Google Play
        shell: bash
        env:
          QUIZZY_KEYSTORE_PASSWORD: ${{ secrets.QUIZZY_KEYSTORE_PASSWORD }}
          QUIZZY_KEY_ALIAS: ${{ secrets.QUIZZY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          RELEASE_DIR="android/app/build/outputs/bundle/release"
          INPUT_AAB="$RELEASE_DIR/app-release-signed.aab"
          if [ ! -f "$INPUT_AAB" ]; then
            INPUT_AAB="$RELEASE_DIR/app-release.aab"
          fi
          if [ ! -f "$INPUT_AAB" ]; then
            echo "ERROR: No se encontró el AAB Release."
            ls -lah "$RELEASE_DIR"
            exit 1
          fi
          KEYSTORE="android/quizzy-upload-key.jks"
          OUTPUT_DIR="$GITHUB_WORKSPACE/play-release"
          OUTPUT_AAB="$OUTPUT_DIR/quizzy-release.aab"
          mkdir -p "$OUTPUT_DIR"
          echo "Aplicando firma SHA256withRSA y digest SHA-256 con la clave de subida existente."
          jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$QUIZZY_KEYSTORE_PASSWORD" \
            -keypass "$QUIZZY_KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "$OUTPUT_AAB" \
            "$INPUT_AAB" \
            "$QUIZZY_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$OUTPUT_AAB" > /tmp/quizzy-signature-check.txt 2>&1 || {
            cat /tmp/quizzy-signature-check.txt
            echo "ERROR: No se pudo verificar la firma del AAB."
            exit 1
          }
          if ! grep -q "Digest algorithm: SHA-256" /tmp/quizzy-signature-check.txt; then
            cat /tmp/quizzy-signature-check.txt
            echo "ERROR: El AAB no muestra digest SHA-256."
            exit 1
          fi
          if ! grep -q "Signature algorithm: SHA256withRSA" /tmp/quizzy-signature-check.txt; then
            cat /tmp/quizzy-signature-check.txt
            echo "ERROR: El AAB no muestra firma SHA256withRSA."
            exit 1
          fi
          echo "Firma SHA-256 verificada correctamente."
          ls -lh "$OUTPUT_AAB"

      - name: Guardar AAB firmado para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-google-play-firmado
          path: play-release/quizzy-release.aab
