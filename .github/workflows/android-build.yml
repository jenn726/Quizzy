name: Quizzy Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Quizzy
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: |
          mkdir -p www
          rsync -a --exclude '.git' --exclude 'android' --exclude 'www' --exclude 'node_modules' ./ www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Quizzy
        run: npx cap sync android

      - name: Generar AAB de prueba
        working-directory: android
        run: ./gradlew bundleDebug

      - name: Guardar AAB de prueba
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Generar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar clave de firma
        env:
          QUIZZY_KEYSTORE_BASE64: ${{ secrets.QUIZZY_KEYSTORE_BASE64 }}
        run: |
          echo "$QUIZZY_KEYSTORE_BASE64" | base64 --decode > android/quizzy-upload-key.jks

      - name: Generar AAB Release firmado
        env:
          QUIZZY_KEYSTORE_PASSWORD: ${{ secrets.QUIZZY_KEYSTORE_PASSWORD }}
          QUIZZY_KEY_ALIAS: ${{ secrets.QUIZZY_KEY_ALIAS }}
        run: |
          npx cap build android --keystorepath quizzy-upload-key.jks --keystorepass "$QUIZZY_KEYSTORE_PASSWORD" --keystorealias "$QUIZZY_KEY_ALIAS" --keystorealiaspass "$QUIZZY_KEYSTORE_PASSWORD" --androidreleasetype AAB

      - name: Verificar y preparar AAB firmado para Google Play
        shell: bash
        run: |
          set -e
          RELEASE_DIR="android/app/build/outputs/bundle/release"
          echo "Archivos AAB generados:"
          ls -lah "$RELEASE_DIR"
          mkdir -p "$GITHUB_WORKSPACE/play-release"
          for candidate in "$RELEASE_DIR/app-release-signed.aab" "$RELEASE_DIR/app-release.aab"; do
            if [ -f "$candidate" ]; then
              echo "Comprobando firma: $candidate"
              jarsigner -verify -verbose -certs "$candidate" > /tmp/quizzy-signature-check.txt 2>&1 || true
              if grep -q 'Signed by ' /tmp/quizzy-signature-check.txt && grep -q 'Signature algorithm:' /tmp/quizzy-signature-check.txt; then
                cp "$candidate" "$GITHUB_WORKSPACE/play-release/quizzy-release.aab"
                echo "El AAB contiene una firma. Se conserva para comprobarla en Google Play."
                exit 0
              fi
              echo "No se detectó una firma en este archivo."
              tail -n 15 /tmp/quizzy-signature-check.txt || true
            fi
          done
          echo "ERROR: No se detectó una firma en los AAB generados."
          exit 1

      - name: Guardar AAB firmado para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: quizzy-google-play-firmado
          path: play-release/quizzy-release.aab
