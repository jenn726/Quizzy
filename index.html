<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzy 🐉</title><style>body{margin:0;padding:20px;font-family:Arial;background:linear-gradient(145deg,#6d28d9,#a855f7);color:white;text-align:center}.card{background:white;color:#4b178f;border-radius:25px;padding:25px;max-width:500px;margin:20px auto}button{display:block;width:100%;padding:15px;margin:9px 0;border:0;border-radius:15px;font-size:17px;font-weight:bold;background:#f0e7ff;color:#4b178f}.play{background:#facc15}.dragon{font-size:70px}#cats,#quiz,#result{display:none}.question{font-size:21px;font-weight:bold;margin:25px 0}.next{background:#7025d6;color:white}</style></head><body><div id="home" class="card"><div class="dragon">🐉</div><h1>Quizzy</h1><h2>¡Hola, aventurero!</h2><p>¿Preparado para aprender jugando?</p><p>⭐ Nivel 1 · Principiante</p><button class="play" onclick="showCats()">🎮 JUGAR</button><button onclick="showCats()">📚 Categorías</button><button onclick="alert('🏆 Próximamente')">🏆 Logros</button><button onclick="alert('🎨 Próximamente')">🎨 Mi dragón</button><button onclick="alert('🎯 Próximamente')">🎯 Misiones</button><button onclick="alert('⚔️ Próximamente')">⚔️ Duelos</button><button onclick="alert('🛍️ Próximamente')">🛍️ Tienda</button></div><div id="cats" class="card"><h1>📚 Categorías</h1><p>Elige qué quieres aprender:</p><button onclick="startQuiz('Matemáticas')">➕ Matemáticas</button><button onclick="startQuiz('Ciencias')">🔬 Ciencias</button><button onclick="startQuiz('Geografía')">🌍 Geografía</button><button onclick="startQuiz('Lengua')">📖 Lengua</button><button onclick="startQuiz('Inglés')">🇬🇧 Inglés</button><button onclick="startQuiz('Historia')">🏛️ Historia</button><button onclick="startQuiz('Cultura general')">🧠 Cultura general</button><button onclick="showHome()">🏠 Inicio</button></div><div id="quiz" class="card"><p id="cat"></p><h2>Pregunta <span id="num">1</span>/3</h2><div id="question" class="question"></div><div id="answers"></div><button id="next" class="next" onclick="nextQuestion()" style="display:none">Siguiente ➡️</button></div><div id="result" class="card"><div class="dragon">🏆</div><h1>¡Reto completado!</h1><h2><span id="score">0</span> puntos</h2><p>¡Buen trabajo, aventurero! 🐉</p><button class="next" onclick="showCats()">📚 Otra categoría</button><button onclick="showHome()">🏠 Inicio</button></div><script>const $=id=>document.getElementById(id);const data={Matemáticas:[["¿Cuánto es 7+5?",["10","12","14"],1],["¿Cuánto es 9x3?",["18","27","30"],1],["¿Cuánto es 20-8?",["10","12","14"],1]],Ciencias:[["¿Cuál es el planeta rojo?",["Marte","Venus","Júpiter"],0],["¿Qué necesitan las plantas para hacer la fotosíntesis?",["Luz","Metal","Plástico"],0],["¿Qué órgano bombea la sangre?",["Pulmón","Corazón","Estómago"],1]],Geografía:[["¿Cuál es la capital de España?",["Madrid","Vigo","Sevilla"],0],["¿En qué continente está España?",["Europa","Asia","África"],0],["¿Cuál es el océano más grande?",["Atlántico","Índico","Pacífico"],2]],Lengua:[["¿Cuál es un sustantivo?",["Casa","Correr","Rápidamente"],0],["¿Cuál es el plural de lápiz?",["Lápizes","Lápices","Lápizs"],1],["¿Cuál es un verbo?",["Saltar","Azul","Mesa"],0]],Inglés:[["¿Cómo se dice perro?",["Cat","Dog","Bird"],1],["¿Cómo se dice rojo?",["Blue","Green","Red"],2],["¿Cómo se dice gracias?",["Hello","Thanks","Goodbye"],1]],Historia:[["¿Quién llegó a América en 1492?",["Cristóbal Colón","Julio César","Napoleón"],0],["¿Dónde vivían los romanos?",["Roma","Egipto","China"],0],["¿Dónde están las pirámides de Guiza?",["Grecia","Egipto","Italia"],1]],"Cultura general":[["¿Cuántos días tiene una semana?",["5","7","9"],1],["¿Cuál es el animal más grande?",["Elefante","Ballena azul","Jirafa"],1],["¿Cuántos colores tiene el arcoíris tradicionalmente?",["5","7","10"],1]]};let list=[],pos=0,points=0;function showHome(){$("home").style.display="block";$("cats").style.display="none";$("quiz").style.display="none";$("result").style.display="none"}function showCats(){$("home").style.display="none";$("cats").style.display="block";$("quiz").style.display="none";$("result").style.display="none"}function startQuiz(category){list=data[category];pos=0;points=0;$("cats").style.display="none";$("quiz").style.display="block";$("result").style.display="none";$("cat").textContent="📚 "+category;showQuestion()}function showQuestion(){let q=list[pos];$("num").textContent=pos+1;$("question").textContent=q[0];let box=$("answers");box.innerHTML="";$("next").style.display="none";q[1].forEach((text,index)=>{let b=document.createElement("button");b.textContent=text;b.onclick=function(){answer(index,b)};box.appendChild(b)})}function answer(index,button){let correct=list[pos][2];$("answers").querySelectorAll("button").forEach(b=>b.disabled=true);if(index===correct){button.style.background="#86efac";points+=10}else{button.style.background="#fca5a5";$("answers").querySelectorAll("button")[correct].style.background="#86efac"}$("next").style.display="block"}function nextQuestion(){pos++;if(pos<list.length){showQuestion()}else{$("quiz").style.display="none";$("result").style.display="block";$("score").textContent=points}}showHome()</script></body></html>
