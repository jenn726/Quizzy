<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzy 🐉</title><style>body{margin:0;padding:20px;font-family:Arial;background:linear-gradient(145deg,#6d28d9,#a855f7);color:white;text-align:center}.card{background:white;color:#4b178f;border-radius:25px;padding:25px;max-width:500px;margin:20px auto}button{display:block;width:100%;padding:15px;margin:9px 0;border:0;border-radius:15px;font-size:17px;font-weight:bold;background:#f0e7ff;color:#4b178f}.play{background:#facc15}.cat{background:#eee}.dragon{font-size:70px}#cats,#quiz,#result{display:none}.question{font-size:21px;font-weight:bold;margin:25px 0}.next{background:#7025d6;color:white}</style></head><body><div id="home" class="card"><div class="dragon">🐉</div><h1>Quizzy</h1><h2>¡Hola, aventurero!</h2><p>¿Preparado para aprender jugando?</p><p>⭐ Nivel 1 · Principiante</p><button class="play" onclick="categorias()">🎮 JUGAR</button><button onclick="categorias()">📚 Categorías</button><button onclick="alert('🏆 Próximamente')">🏆 Logros</button><button onclick="alert('🎨 Próximamente')">🎨 Mi dragón</button><button onclick="alert('🎯 Próximamente')">🎯 Misiones</button><button onclick="alert('⚔️ Próximamente')">⚔️ Duelos</button><button onclick="alert('🛍️ Próximamente')">🛍️ Tienda</button></div><div id="cats" class="card"><h1>📚 Categorías</h1><p>Elige qué quieres aprender:</p><button class="cat" onclick="jugar('Matemáticas')">➕ Matemáticas</button><button class="cat" onclick="jugar('Ciencias')">🔬 Ciencias</button><button class="cat" onclick="jugar('Geografía')">🌍 Geografía</button><button class="cat" onclick="jugar('Lengua')">📖 Lengua</button><button class="cat" onclick="jugar('Inglés')">🇬🇧 Inglés</button><button class="cat" onclick="jugar('Historia')">🏛️ Historia</button><button class="cat" onclick="jugar('Cultura general')">🧠 Cultura general</button><button onclick="inicio()">🏠 Inicio</button></div><div id="quiz" class="card"><p id="categoria"></p><h2>Pregunta <span id="num">1</span>/3</h2><div id="pregunta" class="question"></div><div id="respuestas"></div><button id="siguiente" class="next" onclick="siguiente()" style="display:none">Siguiente ➡️</button></div><div id="result" class="card"><div class="dragon">🏆</div><h1>¡Reto completado!</h1><h2><span id="puntos">0</span> puntos</h2><p id="mensaje"></p><button class="next" onclick="categorias()">📚 Otra categoría</button><button onclick="inicio()">🏠 Inicio</button></div><script>const datos={Matemáticas:[["¿Cuánto es 7+5?",["10","12","14"],1],["¿Cuánto es 9x3?",["18","27","30"],1],["¿Cuánto es 20-8?",["10","12","14"],1]],Ciencias:[["¿Qué planeta es conocido como el planeta rojo?",["Marte","Venus","Júpiter"],0],["¿Qué necesitan las plantas para hacer la fotosíntesis?",["Luz","Metal","Plástico"],0],["¿Cuál es el órgano que bombea la sangre?",["Pulmón","Corazón","Estómago"],1]],Geografía:[["¿Cuál es la capital de España?",["Madrid","Vigo","Sevilla"],0],["¿En qué continente está España?",["Europa","Asia","África"],0],["¿Cuál es el océano más grande?",["Atlántico","Índico","Pacífico"],2]],Lengua:[["¿Cuál es un sustantivo?",["Casa","Correr","Rápidamente"],0],["¿Cuál es el plural de lápiz?",["Lápizes","Lápices","Lápizs"],1],["¿Cuál es un verbo?",["Saltar","Azul","Mesa"],0]],Inglés:[["¿Cómo se dice perro en inglés?",["Cat","Dog","Bird"],1],["¿Cómo se dice rojo?",["Blue","Green","Red"],2],["¿Cómo se dice gracias?",["Hello","Thanks","Goodbye"],1]],Historia:[["¿Quién descubrió América en 1492?",["Cristóbal Colón","Julio César","Napoleón"],0],["¿Dónde vivían los romanos?",["Roma","Egipto","China"],0],["¿En qué país están las pirámides de Guiza?",["Grecia","Egipto","Italia"],1]],"Cultura general":[["¿Cuántos días tiene una semana?",["5","7","9"],1],["¿Cuál es el animal más grande del mundo?",["Elefante","Ballena azul","Jirafa"],1],["¿Cuántos colores tiene el arcoíris tradicionalmente?",["5","7","10"],1]]};let lista=[],n=0,p=0,cat="";function categorias(){home.style.display="none";quiz.style.display="none";result.style.display="none";cats.style.display="block"}function jugar(c){cat=c;lista=datos[c];n=0;p=0;cats.style.display="none";result.style.display="none";quiz.style.display="block";categoria.textContent="📚 "+c;mostrar()}function mostrar(){let q=lista[n];num.textContent=n+1;pregunta.textContent=q[0];respuestas.innerHTML="";siguiente.style.display="none";q[1].forEach((x,i)=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>respuesta(i,b);respuestas.appendChild(b)})}function respuesta(i,b){let q=lista[n];document.querySelectorAll("#respuestas button").forEach(x=>x.disabled=true);if(i==q[2]){b.style.background="#86efac";p+=10}else{b.style.background="#fca5a5";document.querySelectorAll("#respuestas button")[q[2]].style.background="#86efac"}siguiente.style.display="block"}function siguiente(){n++;if(n<lista.length)mostrar();else{quiz.style.display="none";result.style.display="block";puntos.textContent=p;mensaje.textContent=p==30?"¡Perfecto! 🐉":"¡Muy bien! Sigue aprendiendo 💪"}}function inicio(){home.style.display="block";cats.style.display="none";quiz.style.display="none";result.style.display="none"}</script></body></html>
