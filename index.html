<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizzy 🐉</title>
<style>
body{margin:0;padding:20px;text-align:center;font-family:Arial;background:linear-gradient(145deg,#6d28d9,#a855f7);color:white}
.card{background:white;color:#4b178f;border-radius:25px;padding:25px;max-width:500px;margin:20px auto}
button{display:block;width:100%;padding:16px;margin:10px 0;border:0;border-radius:15px;font-size:18px;font-weight:bold}
.play{background:#facc15}
#quiz{display:none}
.answer{background:#eee}
</style>
</head>
<body>

<div class="card">
<div style="font-size:70px">🐉</div>
<h1>Quizzy</h1>
<p>¡Aprende jugando!</p>
<button class="play" onclick="jugar()">🎮 JUGAR</button>
</div>

<div id="quiz" class="card">
<h2 id="pregunta"></h2>
<div id="respuestas"></div>
</div>

<script>
function jugar(){
document.querySelector("body>.card").style.display="none";
document.getElementById("quiz").style.display="block";
document.getElementById("pregunta").textContent="¿Cuál es la capital de España?";
let a=document.getElementById("respuestas");
["Madrid","Vigo","Barcelona"].forEach(x=>{
let b=document.createElement("button");
b.textContent=x;
b.className="answer";
b.onclick=()=>alert(x=="Madrid"?"¡Correcto! 🐉":"¡Inténtalo otra vez!");
a.appendChild(b);
});
}
</script>

</body>
</html>
