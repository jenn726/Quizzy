<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzy 🐉</title><style>body{margin:0;padding:20px;font-family:Arial;background:linear-gradient(145deg,#6d28d9,#a855f7);color:white;text-align:center}.card{background:white;color:#4b178f;border-radius:25px;padding:25px;max-width:500px;margin:20px auto}button{display:block;width:100%;padding:16px;margin:9px 0;border:0;border-radius:15px;font-size:17px;font-weight:bold;background:#f0e7ff;color:#4b178f}.play{background:#facc15}#quiz{display:none}</style></head><body><div id="home" class="card"><div style="font-size:75px">🐉</div><h1>Quizzy</h1><h2>¡Hola, aventurero!</h2><p>¿Preparado para aprender jugando?</p><p>⭐ Nivel 1 · Principiante</p><button class="play" onclick="jugar()">🎮 JUGAR</button><button onclick="alert('📚 Próximamente')">📚 Categorías</button><button onclick="alert('🏆 Próximamente')">🏆 Logros</button><button onclick="alert('🎨 Próximamente')">🎨 Mi dragón</button><button onclick="alert('🎯 Próximamente')">🎯 Misiones</button><button onclick="alert('⚔️ Próximamente')">⚔️ Duelos</button><button onclick="alert('🛍️ Próximamente')">🛍️ Tienda</button></div><div id="quiz" class="card"><h2>🎮 ¡Vamos!</h2><p>¿Cuál es la capital de España?</p><button onclick="alert('¡Correcto! 🐉')">Madrid</button><button onclick="alert('Prueba otra vez')">Vigo</button><button onclick="alert('Prueba otra vez')">Barcelona</button><button onclick="inicio()">🏠 Inicio</button></div><script>function jugar(){document.getElementById("home").style.display="none";document.getElementById("quiz").style.display="block"}function inicio(){document.getElementById("home").style.display="block";document.getElementById("quiz").style.display="none"}</script></body></html>
