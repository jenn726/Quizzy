<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzy 🐉</title><style>body{margin:0;padding:20px;font-family:Arial;background:linear-gradient(145deg,#6d28d9,#a855f7);color:white;text-align:center}.card{background:white;color:#4b178f;border-radius:25px;padding:25px;max-width:500px;margin:20px auto}button{display:block;width:100%;padding:16px;margin:9px 0;border:0;border-radius:15px;font-size:17px;font-weight:bold;background:#f0e7ff;color:#4b178f}.play{background:#facc15}#quiz,#result{display:none}.dragon{font-size:75px}.question{font-size:21px;font-weight:bold;margin:25px 0}.next{background:#7025d6;color:white}</style></head><body><div id="home" class="card"><div class="dragon">🐉</div><h1>Quizzy</h1><h2>¡Hola, aventurero!</h2><p>¿Preparado para aprender jugando?</p><p>⭐ Nivel 1 · Principiante</p><button class="play" onclick="jugar()">🎮 JUGAR</button><button onclick="alert('📚 Próximamente')">📚 Categorías</button><button onclick="alert('🏆 Próximamente')">🏆 Logros</button><button onclick="alert('🎨 Próximamente')">🎨 Mi dragón</button><button onclick="alert('🎯 Próximamente')">🎯 Misiones</button><button onclick="alert('⚔️ Próximamente')">⚔️ Duelos</button><button onclick="alert('🛍️ Próximamente')">🛍️ Tienda</button></div><div id="quiz" class="card"><h2>🎮 Pregunta <span id="num">1</span>/5</h2><div id="pregunta" class="question"></div><div id="respuestas"></div><button id="siguiente" class="next" onclick="siguiente()" style="display:none">Siguiente ➡️</button></div><div id="result" class="card"><div class="dragon">🏆</div><h1>¡Reto completado!</h1><h2><span id="puntos">0</span> puntos</h2><p>¡Buen trabajo, aventurero! 🐉</p><button class="next" onclick="jugar()">🔄 Jugar otra vez</button><button onclick="inicio()">🏠 Inicio</button></div><script>const preguntas=[["¿Cuál es la capital de España?",["Madrid","Vigo","Barcelona"],0],["¿Cuánto es 5 + 7?",["10","12","14"],1],["¿Cuál es el planeta rojo?",["Venus","Marte","Júpiter"],1],["¿Cuántos días tiene una semana?",["5","7","9"],1],["¿Qué animal dice miau?",["Perro","Gato","Caballo"],1]];let n=0,p=0;function jugar(){document.getElementById("home").style.display="none";document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";n=0;p=0;mostrar()}function mostrar(){let q=preguntas[n];document.getElementById("num").textContent=n+1;document.getElementById("pregunta").textContent=q[0];let a=document.getElementById("respuestas");a.innerHTML="";document.getElementById("siguiente").style.display="none";q[1].forEach((x,i)=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>respuesta(i,b);a.appendChild(b)})}function respuesta(i,b){let q=preguntas[n];document.querySelectorAll("#respuestas button").forEach(x=>x.disabled=true);if(i==q[2]){b.style.background="#86efac";p+=10}else{b.style.background="#fca5a5";document.querySelectorAll("#respuestas button")[q[2]].style.background="#86efac"}document.getElementById("siguiente").style.display="block"}function siguiente(){n++;if(n<preguntas.length)mostrar();else{document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";document.getElementById("puntos").textContent=p}}function inicio(){document.getElementById("home").style.display="block";document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="none"}</script></body></html>
