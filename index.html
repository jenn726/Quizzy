<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizzy 🐉</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#6d28d9,#a855f7);color:#4c1d95;min-height:100vh}
.card{background:#fff;border-radius:24px;padding:22px;max-width:520px;margin:18px auto;box-shadow:0 8px 25px rgba(0,0,0,.15)}
h1,h2,h3{margin:8px 0}
.dragon{font-size:76px;text-align:center}
.evo{font-weight:bold;background:#f3e8ff;border-radius:16px;padding:12px;text-align:center}
.stats{background:#f0e7ff;border-radius:16px;padding:12px;margin:10px 0}
button{display:block;width:100%;padding:15px;margin:9px 0;border:0;border-radius:15px;font-size:17px;font-weight:bold;color:#4c1d95;background:#efe7ff;box-shadow:0 3px 0 #d8c4f6;cursor:pointer}
button:hover{filter:brightness(.98)}
button.primary{background:#facc15;color:#4c1d95;box-shadow:0 4px 0 #d3a800}
button.answer{background:#fff;border:2px solid #e9d5ff;box-shadow:none;text-align:left}
button.answer.correct{background:#bbf7d0;border-color:#22c55e}
button.answer.wrong{background:#fecaca;border-color:#ef4444}
.top{background:#efe7ff;border-radius:18px;padding:12px;margin-bottom:10px;text-align:center;font-weight:bold}
.bar{height:14px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:#facc15;width:0;transition:.25s}
.hidden{display:none!important}
.badge{display:inline-block;background:#fef3c7;border-radius:12px;padding:6px 10px;margin:4px}
.small{font-size:13px;color:#6b7280}
input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:12px;font-size:16px;margin:6px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{padding:12px;background:#f3e8ff;border-radius:14px;margin:10px 0}
</style>
</head>
<body>
<div id="app" class="card">
  <div id="home">
    <div class="top">⭐ Nivel <span id="level">1</span> · <span id="xp">0</span> XP
      <div class="bar"><div id="xpfill" class="fill"></div></div>
    </div>
    <div class="top">🪙 <span id="coins">100</span> monedas</div>
    <div class="dragon" id="dragonHome">🐣</div>
    <h1>Quizzy 🐉</h1>
    <h2>¡Hola, aventurero!</h2>
    <p>🎓 Aprende jugando, gana XP y haz crecer a tu dragón.</p>
    <button class="primary" onclick="startHome()">🎮 JUGAR</button>
    <button onclick="showCourse()">📚 Mi curso</button>
    <button onclick="showProfile()">👤 Perfil</button>
    <button onclick="showCats()">📚 Categorías</button>
    <button onclick="showAchievements()">🏆 Logros</button>
    <button onclick="showDragon()">🐉 Mi dragón</button>
    <button onclick="showMissions()">🎯 Misiones</button>
    <button onclick="showDuels()">⚔️ Duelos</button>
    <button onclick="showShop()">🛍️ Tienda</button>
  </div>

  <div id="course" class="hidden"></div>
  <div id="cats" class="hidden"></div>
  <div id="quiz" class="hidden"></div>
  <div id="profile" class="hidden"></div>
  <div id="achievements" class="hidden"></div>
  <div id="dragon" class="hidden"></div>
  <div id="missions" class="hidden"></div>
  <div id="duels" class="hidden"></div>
  <div id="shop" class="hidden"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const screens = ["home","course","cats","quiz","profile","achievements","dragon","missions","duels","shop"];
let playerCourse = localStorage.getItem("quizzyCourse") || "";
let xp = Number(localStorage.getItem("quizzyXP") || 0);
let coins = Number(localStorage.getItem("quizzyCoins") || 100);
let dragonItem = localStorage.getItem("quizzyDragonItem") || "draco";
let dragonName = localStorage.getItem("quizzyDragonName") || "Draco";
let categoriesPlayed = new Set(JSON.parse(localStorage.getItem("quizzyCategories") || "[]"));
let missions = JSON.parse(localStorage.getItem("quizzyMissions") || "null");
let list = [], pos = 0, points = 0, currentCategory = "";

function save(){
  localStorage.setItem("quizzyXP",xp);
  localStorage.setItem("quizzyCoins",coins);
  localStorage.setItem("quizzyCourse",playerCourse);
  localStorage.setItem("quizzyDragonItem",dragonItem);
  localStorage.setItem("quizzyDragonName",dragonName);
  localStorage.setItem("quizzyCategories",JSON.stringify([...categoriesPlayed]));
  updateHeader();

  // Guardar también el progreso en Firebase
  if(window.guardarProgresoQuizzy){
    window.guardarProgresoQuizzy({
      xp: xp,
      monedas: coins,
      curso: playerCourse,
      dragonItem: dragonItem,
      dragonNombre: dragonName,
      categoriasJugadas: [...categoriesPlayed]
    });
  }
}
function updateHeader(){
  const level = Math.floor(xp/100)+1;
  $("level").textContent=level;
  $("xp").textContent=xp;
  $("coins").textContent=coins;
  $("xpfill").style.width=(xp%100)+"%";
  $("dragonHome").textContent=level>=20?"👑":level>=10?"🐉":level>=5?"🐲":level>=3?"✨":level>=2?"🐣":"🥚";
}
function hide(){screens.forEach(s=>$(s).classList.add("hidden"))}
function home(){hide();$("home").classList.remove("hidden");updateHeader()}
function backButton(){return `<button onclick="home()">⬅️ Volver</button>`}

function showCourse(){
  hide(); $("course").classList.remove("hidden");
  $("course").innerHTML=`<h2>📚 Mi curso</h2>
    <p>Elige tu curso para adaptar las preguntas.</p>
    <select id="courseSelect">
      <option value="">Selecciona...</option>
      ${["1º de Primaria","2º de Primaria","3º de Primaria","4º de Primaria","5º de Primaria","6º de Primaria"].map(c=>`<option ${playerCourse===c?"selected":""}>${c}</option>`).join("")}
    </select>
    <button class="primary" onclick="saveCourse()">💾 Guardar curso</button>
    ${playerCourse?`<div class="notice">✅ Curso guardado: <b>${playerCourse}</b></div>`:""}
    ${backButton()}`;
}
function saveCourse(){
  const c=$("courseSelect").value;
  if(!c){alert("Elige un curso");return}
  playerCourse=c; save(); showCats();
}
function showCats(){
  hide(); $("cats").classList.remove("hidden");
  $("cats").innerHTML=`<h2>📚 Categorías</h2>
    ${playerCourse?`<div class="notice">🎓 ${playerCourse}</div>`:`<div class="notice">Elige primero tu curso.</div>`}
    <button class="primary" onclick="startQuiz('Matemáticas')">➗ Matemáticas</button>
    <button onclick="startQuiz('Lengua')">📖 Lengua</button>
    <button onclick="startQuiz('Ciencias')">🔬 Ciencias</button>
    <button onclick="startQuiz('Geografía')">🌍 Geografía</button>
<button onclick="startQuiz('Inglés')">🇬🇧 Inglés</button>
<button onclick="startQuiz('Historia')">🧠 Historia</button>
    ${backButton()}`;
}
async function startQuiz(category){
  if(!playerCourse){showCourse();return}
  currentCategory=category;
  categoriesPlayed.add(category); save();
  try{
    const r=await fetch("preguntas.json?"+Date.now());
    const data=await r.json();
    list=(data[playerCourse]&&data[playerCourse][category])||[];
  }catch(e){list=[]}
  if(!list.length){alert("No hay preguntas disponibles para esta categoría.");return}
  pos=0;points=0;
  hide();$("quiz").classList.remove("hidden");
  renderQuestion();
}
function renderQuestion(){
  if(pos>=list.length){finishQuiz();return}
  const q=list[pos];
  $("quiz").innerHTML=`<h2>🎯 ${currentCategory}</h2>
    <div class="notice">Pregunta ${pos+1} de ${list.length}</div>
    <h3>${q[0]}</h3>
    ${q[1].map((a,i)=>`<button class="answer" onclick="answer(${i})">${a}</button>`).join("")}
    ${backButton()}`;
}
function answer(i){
  const q=list[pos];
  const buttons=[...$("quiz").querySelectorAll(".answer")];
  buttons.forEach((b,n)=>b.disabled=true);
  if(i===q[2]){
    points++; xp+=10; coins+=5; buttons[i].classList.add("correct");
  }else{
    buttons[i].classList.add("wrong");
    if(buttons[q[2]])buttons[q[2]].classList.add("correct");
  }
  save();
  setTimeout(()=>{pos++;renderQuestion()},500);
}
function finishQuiz(){
  const bonus=points*5; xp+=bonus;
  $("quiz").innerHTML=`<h2>🎉 ¡Quiz terminado!</h2>
    <div class="notice">Has acertado <b>${points}</b> de ${list.length}.<br>⭐ Ganaste ${points*10+bonus} XP.</div>
    <button class="primary" onclick="showCats()">🔄 Otra categoría</button>
    ${backButton()}`;
  save();
}
function startHome(){ if(!playerCourse){showCourse()}else{showCats()} }

function showProfile(){
  hide();$("profile").classList.remove("hidden");
  $("profile").innerHTML=`<h2>👤 Perfil</h2>
    <div class="stats"><b>🎓 Curso:</b> ${playerCourse||"Sin elegir"}<br><b>⭐ XP:</b> ${xp}<br><b>🪙 Monedas:</b> ${coins}<br><b>📚 Categorías jugadas:</b> ${[...categoriesPlayed].join(", ")||"Ninguna"}</div>
    <button onclick="showCourse()">📚 Cambiar curso</button>${backButton()}`;
}
function showAchievements(){
  hide();$("achievements").classList.remove("hidden");
  const level=Math.floor(xp/100)+1;
  $("achievements").innerHTML=`<h2>🏆 Logros</h2>
    <div class="notice">${xp>=100?"🏅":"🔒"} Llegar a 100 XP<br>
    ${categoriesPlayed.size>=2?"🏅":"🔒"} Jugar 2 categorías<br>
    ${level>=5?"🏅":"🔒"} Llegar al nivel 5</div>${backButton()}`;
}
function showDragon(){
  hide();$("dragon").classList.remove("hidden");
  const level=Math.floor(xp/50)+1;
  const emoji=level>=20?"👑":level>=10?"🐉":level>=5?"🐲":level>=3?"✨":level>=2?"🐣":"🥚";
  $("dragon").innerHTML=`<h2>🐉 Mi dragón</h2><div class="dragon">${emoji}</div>
    <p>💜 Tu compañero: <b>${dragonName}</b></p>
    <input id="dragonInput" value="${dragonName}" maxlength="18" placeholder="Nombre del dragón">
    <button class="primary" onclick="saveDragon()">💾 Guardar nombre</button>
    <div class="evo">🌟 Evolución<br>🥚 Nivel 1 → 🐣 Nivel 2 → 🐲 Nivel 5 → 🐉 Nivel 10 → 👑 Nivel 20</div>
    ${backButton()}`;
}
function saveDragon(){
  const n=$("dragonInput").value.trim();
  if(!n){alert("Escribe un nombre");return}
  dragonName=n;save();showDragon();
}
function resetMissions(){
  const today=new Date().toISOString().slice(0,10);
  if(!missions||missions.date!==today){
    missions={date:today,q:0,xp:false,cats:[]};
    localStorage.setItem("quizzyMissions",JSON.stringify(missions));
  }
}
function showMissions(){
  resetMissions();hide();$("missions").classList.remove("hidden");
  $("missions").innerHTML=`<h2>🎯 Misiones de hoy</h2>
    <div class="notice">${missions.q>=5?"✅":"⬜"} Responde 5 preguntas: <b>${missions.q}/5</b><br>
    ${missions.xp?"✅":"⬜"} Consigue 30 XP<br>
    ${missions.cats.length>=2?"✅":"⬜"} Juega 2 categorías diferentes: <b>${missions.cats.length}/2</b></div>
    ${backButton()}`;
}
function showDuels(){
  hide();$("duels").classList.remove("hidden");
  $("duels").innerHTML=`<h2>⚔️ Duelos</h2>
    <div class="notice">Próximamente podrás retar a otro jugador.</div>
    <button class="primary" onclick="alert('Aún no hay preguntas suficientes para el duelo.')">⚔️ Buscar rival</button>
    ${backButton()}`;
}
function showShop(){
  hide();$("shop").classList.remove("hidden");
  const items=[["draco","🐉 Draco",50],["fenix","🔥 Fénix",120],["supremo","👑 Dragón Supremo",250]];
  $("shop").innerHTML=`<h2>🛍️ Tienda</h2><div class="notice">🪙 Tienes ${coins} monedas</div>
    ${items.map(([id,n,p])=>`<button onclick="buyItem('${id}',${p})">${n} · ${p} 🪙 ${dragonItem===id?"✅ Equipado":""}</button>`).join("")}
    ${backButton()}`;
}
function buyItem(id,p){
  if(dragonItem===id){showShop();return}
  if(coins<p){alert("No tienes suficientes monedas.");return}
  coins-=p;dragonItem=id;save();showShop();
}

const oldAnswer=answer;
const oldFinish=finishQuiz;
function missionUpdate(){
  resetMissions();
  missions.q=Math.min(5,missions.q+1);
  if(xp>=30)missions.xp=true;
  if(currentCategory&&!missions.cats.includes(currentCategory))missions.cats.push(currentCategory);
  localStorage.setItem("quizzyMissions",JSON.stringify(missions));
}
// wrap answer safely so missions always update
answer=function(i){
  missionUpdate();
  oldAnswer(i);
}
finishQuiz=oldFinish;

resetMissions();
updateHeader();
// ===== FIREBASE =====
(async function () {
  try {
    const { initializeApp } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
    );

    const { getFirestore, doc, setDoc } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );

    const firebaseConfig = {
      apiKey: "AIzaSyDlB9B0bGZcj6GkCQ6y2ciPPxxYHJxccxo",
      authDomain: "quizzy-8ddf4.firebaseapp.com",
      projectId: "quizzy-8ddf4",
      storageBucket: "quizzy-8ddf4.firebasestorage.app",
      messagingSenderId: "1047881908068",
      appId: "1:1047881908068:web:0c173bc4d790a4f3a88471",
      measurementId: "G-1SBGWFDDNF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.quizzyFirebase = {
      db,
      doc,
      setDoc
    };

    console.log("🔥 Firebase conectado correctamente a Quizzy");
    // ===== GUARDAR PROGRESO EN FIREBASE =====
window.guardarProgresoQuizzy = async function(datos) {
  try {
    await setDoc(
      doc(db, "usuarios", "nMUhUp5ak3HwNrrY091a"),
      {
        ...datos,
        actualizadoEn: new Date()
      },
      { merge: true }
    );

    console.log("💾 Progreso guardado en Firebase", datos);
  } catch (error) {
    console.error("❌ Error guardando progreso:", error);
  }
};
  } catch (error) {
    console.error("❌ Error conectando Firebase:", error);
  }
})();
</script>
</body>
</html>
