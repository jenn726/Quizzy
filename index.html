<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizzy 🐉</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#6d28d9,#a855f7);color:#4c1d95;min-height:100vh}
.card{background:#fff;border-radius:24px;padding:22px;max-width:520px;margin:18px auto;box-shadow:0 8px 25px rgba(0,0,0,.15)}
h1,h2,h3{margin:8px 0}
.dragon{font-size:76px;text-align:center}
.evo{font-weight:bold;background:#f3e8ff;border-radius:16px;padding:12px;text-align:center}
.stats{background:#f0e7ff;border-radius:16px;padding:12px;margin:10px 0}
button{display:block;width:100%;padding:15px;margin:9px 0;border:0;border-radius:15px;font-size:17px;font-weight:bold;color:#4c1d95;background:#efe7ff;box-shadow:0 3px 0 #d8c4f6;cursor:pointer}
button:hover{filter:brightness(.98)}
button.primary{background:#facc15;color:#4c1d95;box-shadow:0 4px 0 #d3a800}
button.answer{background:#fff;border:2px solid #e9d5ff;box-shadow:none;text-align:left}
button.answer.correct{background:#bbf7d0;border-color:#22c55e}
button.answer.wrong{background:#fecaca;border-color:#ef4444}
.top{background:#efe7ff;border-radius:18px;padding:12px;margin-bottom:10px;text-align:center;font-weight:bold}
.bar{height:14px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:#facc15;width:0;transition:.25s}
.hidden{display:none!important}
.badge{display:inline-block;background:#fef3c7;border-radius:12px;padding:6px 10px;margin:4px}
.small{font-size:13px;color:#6b7280}
input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:12px;font-size:16px;margin:6px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{padding:12px;background:#f3e8ff;border-radius:14px;margin:10px 0}.item{background:#faf5ff;border:2px solid #e9d5ff;border-radius:18px;padding:14px;margin:10px 0}.item img{display:block;width:130px;height:130px;object-fit:contain;margin:auto}.done{opacity:.7;border-color:#22c55e}.price{font-weight:bold;color:#7c3aed}
.duel-hit{animation:duelHit 0.45s ease}
@keyframes duelHit{0%{transform:scale(1)}35%{transform:scale(1.12) rotate(-3deg)}65%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.quiz-card{animation:aparecer .25s ease-out}
.answer{transition:transform .15s ease,box-shadow .15s ease}
.answer:hover{transform:scale(1.02)}
.answer.correct{animation:correcta .35s ease}
.answer.wrong{animation:incorrecta .35s ease}
.notice{animation:aparecer .25s ease-out}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes correcta{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes incorrecta{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app" class="card">
<div id="home"><div class="top">⭐ Nivel <span id="level">1</span> · <span id="xp">0</span> XP<div class="bar"><div id="xpfill" class="fill"></div></div></div><div class="top">🪙 <span id="coins">100</span> monedas</div><div class="dragon" id="dragonHome">🐣</div><h1>Quizzy 🐉</h1><h2>¡Hola, aventurero!</h2><p>🎓 Aprende jugando, gana XP y haz crecer a tu dragón.</p><button class="primary" onclick="startHome()">🎮 JUGAR</button><button onclick="showCourse()">📚 Mi curso</button><button onclick="showProfile()">👤 Perfil</button><button onclick="showCats()">📚 Categorías</button><button onclick="showAchievements()">🏆 Logros</button><button onclick="showDragon()">🐉 Mi dragón</button><button onclick="showMissions()">🎯 Misiones</button><button onclick="showDuels()">⚔️ Duelos</button><button onclick="showShop()">🛍️ Tienda</button><button onclick="showParents()">👨‍👩‍👧 Zona de padres</button><button onclick="showAccount()">🔐 Mi cuenta</button></div>
<div id="course" class="hidden"></div><div id="cats" class="hidden"></div><div id="quiz" class="hidden"></div><div id="profile" class="hidden"></div><div id="achievements" class="hidden"></div><div id="dragon" class="hidden"></div><div id="missions" class="hidden"></div><div id="duels" class="hidden"></div><div id="shop" class="hidden"></div><div id="parents" class="hidden"></div><div id="account" class="hidden"></div>
</div>
  <script src="cargar-preguntas-ampliadas.js"></script>
<script type="module" src="firebase-quizzy.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("Quizzy: service worker registrado"))
      .catch(error => console.error("Quizzy: error registrando service worker", error));
  });
}
</script>
<script>
const $=id=>document.getElementById(id);const screens=["home","course","cats","quiz","profile","achievements","dragon","missions","duels","shop","parents","account"];
let playerCourse=localStorage.getItem("quizzyCourse")||"";let xp=Number(localStorage.getItem("quizzyXP")||0);let coins=Number(localStorage.getItem("quizzyCoins")||100);let dragonItem=localStorage.getItem("quizzyDragonItem")||"draco";let dragonName=localStorage.getItem("quizzyDragonName")||"Draco";let dragonColor=localStorage.getItem("quizzyDragonColor")||"original";let dragonAccessory=localStorage.getItem("quizzyDragonAccessory")||"ninguno";let dragonEffect=localStorage.getItem("quizzyDragonEffect")||"ninguno";let categoriesPlayed=new Set(JSON.parse(localStorage.getItem("quizzyCategories")||"[]"));let missions=JSON.parse(localStorage.getItem("quizzyMissions")||"null");let claimedAchievements=JSON.parse(localStorage.getItem("quizzyClaimedAchievements")||"[]");let list=[],pos=0,points=0,currentCategory="";let questionsAnswered=Number(localStorage.getItem("quizzyQuestionsAnswered")||0);let correctAnswers=Number(localStorage.getItem("quizzyCorrectAnswers")||0);
const achievementDefs=[['primeros','🌱 Primeros pasos',()=>questionsAnswered>=1,'Contesta tu primera pregunta',20],['diez','⭐ 10 aciertos',()=>correctAnswers>=10,'Consigue 10 respuestas correctas',40],['cincuenta','🏆 50 aciertos',()=>correctAnswers>=50,'Consigue 50 respuestas correctas',100],['explorador','📚 Explorador',()=>categoriesPlayed.size>=4,'Juega 4 categorías diferentes',50],['gran-explorador','🌍 Gran explorador',()=>categoriesPlayed.size>=7,'Juega las 7 categorías',100],['experto','🎓 Experto',()=>xp>=1000,'Alcanza 1000 XP',150]];
function getQuizzyProgress(){return {xp,coins,course:playerCourse,dragonItem,dragonName,dragonColor,dragonAccessory,dragonEffect,categoriesPlayed:[...categoriesPlayed],questionsAnswered,correctAnswers,claimedAchievements:[...claimedAchievements],missions}}function updateAchievements(){localStorage.setItem('quizzyClaimedAchievements',JSON.stringify(claimedAchievements))}
function claimAchievement(id){const a=achievementDefs.find(x=>x[0]===id);if(!a||!a[2]()||claimedAchievements.includes(id))return;claimedAchievements.push(id);coins+=a[4];updateAchievements();save();showAchievements();showReward('🏆 ¡Logro reclamado! +'+a[4]+' 🪙')}
function save(){const oldXp=Number(localStorage.getItem("quizzyXP")||0);const oldLevel=Math.floor(oldXp/100)+1;localStorage.setItem("quizzyXP",xp);localStorage.setItem("quizzyCoins",coins);localStorage.setItem("quizzyCourse",playerCourse);localStorage.setItem("quizzyDragonItem",dragonItem);localStorage.setItem("quizzyDragonName",dragonName);localStorage.setItem("quizzyDragonColor",dragonColor);localStorage.setItem("quizzyDragonAccessory",dragonAccessory);localStorage.setItem("quizzyDragonEffect",dragonEffect);localStorage.setItem("quizzyCategories",JSON.stringify([...categoriesPlayed]));localStorage.setItem("quizzyQuestionsAnswered",questionsAnswered);localStorage.setItem("quizzyCorrectAnswers",correctAnswers);updateHeader();const newLevel=Math.floor(xp/100)+1;if(newLevel>oldLevel){showReward("🎉 ¡Subiste al nivel "+newLevel+"!");coins+=25;localStorage.setItem("quizzyCoins",coins);updateHeader()}if(window.guardarProgresoQuizzy)window.guardarProgresoQuizzy({xp,monedas:coins,curso:playerCourse,dragonItem,dragonNombre:dragonName,categoriasJugadas:[...categoriesPlayed],dragonColor,dragonAccessory,dragonEffect,preguntasRespondidas:questionsAnswered,respuestasCorrectas:correctAnswers,logrosConseguidos:claimedAchievements,misiones:missions})}
function updateHeader(){const level=Math.floor(xp/100)+1;$("level").textContent=level;$("xp").textContent=xp;$("coins").textContent=coins;$("xpfill").style.width=(xp%100)+"%";$("dragonHome").innerHTML=`<img src="${dragonImage()}" style="width:180px;height:180px;object-fit:contain;cursor:pointer;" onclick="showDragon()">`}
function hide(){screens.forEach(s=>{if($(s))$(s).classList.add("hidden")})}function home(){hide();$("home").classList.remove("hidden");updateHeader()}function backButton(){return `<button onclick="home()">⬅️ Volver</button>`}
function exportQuizzyProgress(){const data=getQuizzyProgress();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='quizzy-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showReward('💾 ¡Progreso guardado!')}
function actualizarCuentaFirebase(user){if(!$("account")||$("account").classList.contains("hidden"))return;showAccount()}
function aplicarProgresoNube(data){xp=Number(data.xp||0);coins=Number(data.coins||0);playerCourse=data.course||"";dragonItem=data.dragonItem||"draco";dragonName=data.dragonName||"Draco";dragonColor=data.dragonColor||"original";dragonAccessory=data.dragonAccessory||"ninguno";dragonEffect=data.dragonEffect||"ninguno";categoriesPlayed=new Set(Array.isArray(data.categoriesPlayed)?data.categoriesPlayed:[]);questionsAnswered=Number(data.questionsAnswered||0);correctAnswers=Number(data.correctAnswers||0);claimedAchievements=Array.isArray(data.claimedAchievements)?data.claimedAchievements:[];missions=data.missions||null;localStorage.setItem("quizzyMissions",JSON.stringify(missions));save();home()}
function importQuizzyProgress(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(typeof data.xp!=="number"||typeof data.coins!=="number"||typeof data.course!=="string")throw new Error("Archivo no válido");xp=data.xp;coins=data.coins;playerCourse=data.course;dragonItem=data.dragonItem||"draco";dragonName=data.dragonName||"Draco";dragonColor=data.dragonColor||"original";dragonAccessory=data.dragonAccessory||"ninguno";dragonEffect=data.dragonEffect||"ninguno";categoriesPlayed=new Set(Array.isArray(data.categoriesPlayed)?data.categoriesPlayed:[]);questionsAnswered=Number(data.questionsAnswered||0);correctAnswers=Number(data.correctAnswers||0);claimedAchievements=Array.isArray(data.claimedAchievements)?data.claimedAchievements:[];missions=data.missions||null;localStorage.setItem("quizzyMissions",JSON.stringify(missions));save();home();showReward("✅ ¡Progreso restaurado!");}catch(e){alert("No se pudo restaurar el progreso: "+e.message)}};reader.readAsText(file)}
function showAccount(){hide();$("account").classList.remove("hidden");const user=window.quizzyUser;const logged=!!user;$("account").innerHTML=`<h2>🔐 Mi cuenta</h2><div class="notice" style="text-align:center;"><div style="font-size:55px;">🐉</div><h3>${logged?'☁️ Cuenta conectada':'¡Bienvenido a Quizzy!'}</h3>${logged?`<p>Has iniciado sesión como <b>${user.email||user.displayName||'usuario'}</b>.</p><p class="small">Tu progreso se guarda automáticamente en la nube.</p><button onclick="quizzyLogout()">🚪 Cerrar sesión</button>`:`<p>Inicia sesión para guardar tu progreso y recuperarlo en otros dispositivos.</p>`}</div>${logged?'':`<div class="item"><b>🔵 Entrar con Google</b><button class="primary" onclick="quizzyGoogleLogin()">Continuar con Google</button></div><div class="item"><b>📧 Correo electrónico</b><input id="quizzyEmail" type="email" placeholder="Tu correo"><input id="quizzyPassword" type="password" placeholder="Contraseña (mínimo 6 caracteres)"><button class="primary" onclick="quizzyEmailLogin()">📧 Entrar con correo</button><button onclick="quizzyEmailRegister()">🆕 Crear cuenta</button><button onclick="quizzyPasswordReset()">🔑 He olvidado mi contraseña</button></div>`}<div class="item"><b>💾 Copia de seguridad</b><p class="small">También puedes guardar una copia manual de tu progreso en un archivo.</p><button onclick="exportQuizzyProgress()">⬇️ Descargar mi progreso</button><input id="progressFile" type="file" accept=".json,application/json" style="display:none" onchange="importQuizzyProgress(event)"><button onclick="$('progressFile').click()">⬆️ Restaurar mi progreso</button></div>${logged?'':'<div class="notice" style="text-align:center;">👤 Actualmente estás jugando como invitado.</div>'}${backButton()}`}
function showCourse(){hide();$("course").classList.remove("hidden");$("course").innerHTML=`<h2>📚 Mi curso</h2><p>Elige tu curso para adaptar las preguntas.</p><select id="courseSelect"><option value="">Selecciona...</option>${["1º de Primaria","2º de Primaria","3º de Primaria","4º de Primaria","5º de Primaria","6º de Primaria"].map(c=>`<option ${playerCourse===c?"selected":""}>${c}</option>`).join("")}</select><button class="primary" onclick="saveCourse()">💾 Guardar curso</button>${playerCourse?`<div class="notice">✅ Curso guardado: <b>${playerCourse}</b></div>`:""}${backButton()}`}
function saveCourse(){const c=$("courseSelect").value;if(!c){alert("Elige un curso");return}playerCourse=c;save();showCats()}
function showCats(){hide();$("cats").classList.remove("hidden");$("cats").innerHTML=`<h2>📚 Categorías</h2>${playerCourse?`<div class="notice">🎓 ${playerCourse}</div>`:`<div class="notice">Elige primero tu curso.</div>`}<button class="primary" onclick="startQuiz('Matemáticas')">➗ Matemáticas</button><button onclick="startQuiz('Lengua')">📖 Lengua</button><button onclick="startQuiz('Ciencias')">🔬 Ciencias</button><button onclick="startQuiz('Geografía')">🌍 Geografía</button><button onclick="startQuiz('Inglés')">🇬🇧 Inglés</button><button onclick="startQuiz('Historia')">🧠 Historia</button><button onclick="startQuiz('Cultura general')">🌟 Cultura general</button>${backButton()}`}
async function startQuiz(category){if(!playerCourse){showCourse();return}currentCategory=category;categoriesPlayed.add(category);save();try{   list=await cargarPreguntasAmpliadas(playerCourse,category);}catch(e){alert("Error cargando preguntas: "+e.message);console.error(e);list=[]}if(!list.length){alert("No hay preguntas disponibles para esta categoría.");return}
// Mezclar las preguntas cada vez que empieza una partida.
list=[...list].sort(()=>Math.random()-0.5).slice(0,5);
pos=0;points=0;hide();$("quiz").classList.remove("hidden");renderQuestion()}
function renderQuestion(){if(pos>=list.length){finishQuiz();return}const q=list[pos];$("quiz").innerHTML=`<h2>🎯 ${currentCategory}</h2><div class="notice">Pregunta ${pos+1} de ${list.length}</div><h3>${q[0]}</h3>${q[1].map((a,i)=>`<button class="answer" onclick="answer(${i})">${a}</button>`).join("")}${backButton()}`}
function showReward(text){const reward=document.createElement("div");reward.textContent=text;reward.style="position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:18px 28px;border-radius:18px;font-size:22px;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:9999;text-align:center;";document.body.appendChild(reward);setTimeout(()=>reward.remove(),800)}
function answer(i){const q=list[pos];questionsAnswered++;const buttons=[...$("quiz").querySelectorAll(".answer")];buttons.forEach(b=>b.disabled=true);if(i===q[2]){correctAnswers++;points++;xp+=10;coins+=5;buttons[i].classList.add("correct");showReward("🎉 ¡Correcto! +10 XP ⭐ +5 🪙")}else{buttons[i].classList.add("wrong");if(buttons[q[2]])buttons[q[2]].classList.add("correct");showReward("❌ Incorrecto. ¡Sigue intentándolo!")}updateMissions();updateAchievements();initMissions();missions.items[0].progress=Math.min(missions.items[0].target,missions.items[0].progress+1);if(i===q[2])missions.items[1].progress=Math.min(missions.items[1].target,missions.items[1].progress+10);updateMissions();save();setTimeout(()=>{pos++;renderQuestion()},500)}
function finishQuiz(){const bonus=points*5;xp+=bonus;$("quiz").innerHTML=`<h2>🎉 ¡Quiz terminado!</h2><div class="notice">Has acertado <b>${points}</b> de ${list.length}.<br>⭐ Ganaste ${points*10+bonus} XP.</div><button class="primary" onclick="showCats()">🔄 Otra categoría</button>${backButton()}`;save()}
function startHome(){if(!playerCourse){showCourse()}else{showCats()}}
function showProfile(){hide();$("profile").classList.remove("hidden");$("profile").innerHTML=`<h2>👤 Perfil</h2><div class="stats">⭐ Nivel: <b>${Math.floor(xp/100)+1}</b><br>XP: <b>${xp}</b><br>🪙 Monedas: <b>${coins}</b><br>❓ Preguntas: <b>${questionsAnswered}</b><br>✅ Aciertos: <b>${correctAnswers}</b></div>${backButton()}`}
function showAchievements(){updateAchievements();hide();$("achievements").classList.remove("hidden");$("achievements").innerHTML=`<h2>🏆 Logros</h2>${achievementDefs.map(a=>{const unlocked=a[2](),claimed=claimedAchievements.includes(a[0]);return `<div class="item ${unlocked?'done':''}"><b>${a[1]}</b><br><span class="small">${a[3]}</span><br>🪙 ${a[4]} monedas<br>${claimed?'✅ Recompensa reclamada':unlocked?`<button class="primary" onclick="claimAchievement('${a[0]}')">🎁 Reclamar recompensa</button>`:'🔒 Pendiente'}</div>`}).join('')}${backButton()}`}
function dragonImage(){return dragonItem==='fenix'?'fenix.png':dragonItem==='dragon-supremo'?'dragon-supremo-nuevo.png':(Math.floor(xp/100)+1>=20?'dragon-supremo2.png':Math.floor(xp/100)+1>=10?'dragon-legendario.png':Math.floor(xp/100)+1>=5?'dragon-poderoso.png':Math.floor(xp/100)+1>=3?'dragon-magico.png':Math.floor(xp/100)+1>=2?'dragon-joven.png':'dragon-morado.png')}
function dragonLabel(){return dragonItem==='fenix'?'🔥 Fénix':dragonItem==='dragon-supremo'?'👑 Dragón Supremo':'🐉 Draco'}
function showDragon(){hide();$("dragon").classList.remove("hidden");const level=Math.floor(xp/100)+1;const colorBg=dragonColor==="azul"?"#dbeafe":dragonColor==="verde"?"#dcfce7":"#f3e8ff";const accessory=dragonAccessory==="corona"?"👑":dragonAccessory==="sombrero"?"🎩":dragonAccessory==="gafas"?"👓":"";const effect=dragonEffect==="brillo"?"✨":dragonEffect==="fuego"?"🔥":dragonEffect==="estrellas"?"⭐✨⭐":"";$("dragon").innerHTML=`<h2>🐉 Mi dragón</h2><div class="item" style="text-align:center"><div style="padding:18px;border-radius:50%;background:${colorBg};display:inline-block"><div style="position:relative;display:inline-block;width:220px;height:220px"><img src="${dragonImage()}" alt="${dragonLabel()}" style="width:220px;height:220px;object-fit:contain">${accessory?`<div style="position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:48px;pointer-events:none">${accessory}</div>`:""}${effect?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:8px;pointer-events:none">${effect}</div>`:""}</div></div><div class="evo">${dragonName}</div><p>Nivel ${level} · ${dragonLabel()}</p><div class="notice">⭐ ${xp} XP · 🪙 ${coins} monedas</div></div><input id="dragonNameInput" value="${dragonName}" maxlength="20" placeholder="Nombre de tu dragón"><button class="primary" onclick="renameDragon()">💾 Guardar nombre</button><button class="primary" onclick="showCustomize()">🎨 Personalizar</button><div class="evo">🎨 Color: ${dragonColor==="azul"?"💙 Azul":dragonColor==="verde"?"💚 Verde":"💜 Morado"} · 👑 Accesorio: ${dragonAccessory==="ninguno"?"Ninguno":dragonAccessory} · ✨ Efecto: ${dragonEffect==="ninguno"?"Ninguno":dragonEffect}</div>${backButton()}`}
function showCustomize(){hide();$("dragon").classList.remove("hidden");$("dragon").innerHTML=`<h2>🎨 Personalizar a Draco</h2><div class="evo">🐲 Elige cómo quieres que sea tu dragón</div><button class="primary" onclick="showColors()">🎨 Color</button><button class="primary" onclick="showAccessories()">👑 Accesorios</button><button class="primary" onclick="showEffects()">✨ Efectos</button><button onclick="showDragon()">⬅️ Volver</button>`}
function showColors(){$("dragon").innerHTML=`<h2>🎨 Color de Draco</h2><div class="evo">Elige un color para tu dragón</div><button class="primary" onclick="setDragonColor('original')">💜 Morado</button><button class="primary" onclick="setDragonColor('azul')">💙 Azul</button><button class="primary" onclick="setDragonColor('verde')">💚 Verde</button><button onclick="showCustomize()">⬅️ Volver</button>`}
function setDragonColor(color){dragonColor=color;save();showDragon()}
function showAccessories(){$("dragon").innerHTML=`<h2>👑 Accesorios de Draco</h2><div class="evo">Elige un accesorio para tu dragón</div><button class="primary" onclick="setDragonAccessory('corona')">👑 Corona</button><button class="primary" onclick="setDragonAccessory('sombrero')">🎩 Sombrero</button><button class="primary" onclick="setDragonAccessory('gafas')">🕶️ Gafas</button><button onclick="setDragonAccessory('ninguno')">❌ Ninguno</button><button onclick="showCustomize()">⬅️ Volver</button>`}
function setDragonAccessory(accessory){dragonAccessory=accessory;save();showDragon()}
function showEffects(){$("dragon").innerHTML=`<h2>✨ Efectos de Draco</h2><div class="evo">Elige un efecto para tu dragón</div><button class="primary" onclick="setDragonEffect('brillo')">✨ Brillo mágico</button><button class="primary" onclick="setDragonEffect('fuego')">🔥 Fuego</button><button class="primary" onclick="setDragonEffect('estrellas')">💫 Estrellas</button><button onclick="setDragonEffect('ninguno')">❌ Ninguno</button><button onclick="showCustomize()">⬅️ Volver</button>`}
function setDragonEffect(effect){dragonEffect=effect;save();showDragon()}
function initMissions(){const now=new Date();const today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");if(!missions||missions.date!==today){missions={date:today,items:[{text:'Responde 5 preguntas',target:5,progress:0,reward:20,done:false,claimed:false},{text:'Consigue 30 XP',target:30,progress:0,reward:25,done:false,claimed:false},{text:'Juega 2 categorías diferentes',target:2,progress:0,reward:30,done:false,claimed:false}]};localStorage.setItem('quizzyMissions',JSON.stringify(missions))}}function updateMissions(){initMissions();missions.items[2].progress=Math.min(missions.items[2].target,categoriesPlayed.size);missions.items.forEach(m=>m.done=m.progress>=m.target);localStorage.setItem('quizzyMissions',JSON.stringify(missions))}function claimMission(i){initMissions();const m=missions.items[i];if(!m.done||m.claimed)return;m.claimed=true;coins+=m.reward;save();showMissions()}function showMissions(){updateMissions();hide();$("missions").classList.remove("hidden");$("missions").innerHTML=`<h2>🎯 Misiones</h2>${missions.items.map((m,i)=>`<div class="item ${m.done?'done':''}"><b>${m.text}</b><br>${m.progress}/${m.target} · 🪙 ${m.reward}${m.claimed?'<br>✅ Recompensa conseguida':m.done?`<button class="primary" onclick="claimMission(${i})">🎁 Reclamar</button>`:'<br>🔒 En progreso'}</div>`).join('')}${backButton()}`}
let duelQuestions=[],duelPos=0,duelScores=[0,0],duelCategory="";
async function startDuel(){if(!playerCourse){showCourse();return}duelCategory=$("duelCategory").value;const pool=[],seen=new Set();try{for(let intento=0;intento<3&&pool.length<6;intento++){const batch=await cargarPreguntasAmpliadas(playerCourse,duelCategory);for(const q of batch){const key=String(q[0]);if(!seen.has(key)){seen.add(key);pool.push(q)}if(pool.length>=6)break}}}catch(e){alert("Error cargando el duelo: "+e.message);return}if(pool.length<6){alert("No hay preguntas suficientes para el duelo.");return}duelQuestions=pool.slice(0,6);duelPos=0;duelScores=[0,0];renderDuel()}
function renderDuel(){hide();$("duels").classList.remove("hidden");const player=duelPos<3?0:1,q=duelQuestions[duelPos];$("duels").innerHTML='<h2>⚔️ Duelo</h2><div class="stats">👤 Jugador 1: '+duelScores[0]+' puntos · 👤 Jugador 2: '+duelScores[1]+' puntos</div><div class="notice">Turno de <b>Jugador '+(player+1)+'</b> · Pregunta '+(duelPos+1)+' de 6</div><h3>'+q[0]+'</h3>'+q[1].map((a,i)=>'<button class="answer" onclick="answerDuel('+i+')">'+a+'</button>').join('')}
function answerDuel(i){const q=duelQuestions[duelPos],player=duelPos<3?0:1,buttons=[...$("duels").querySelectorAll(".answer")];buttons.forEach(b=>b.disabled=true);if(i===q[2]){duelScores[player]++;buttons[i].classList.add("correct");showReward("🎉 ¡Correcto!")}else{buttons[i].classList.add("wrong");if(buttons[q[2]])buttons[q[2]].classList.add("correct");showReward("❌ Incorrecto")}setTimeout(()=>{duelPos++;if(duelPos>=6)finishDuel();else renderDuel()},650)}
function finishDuel(){hide();$("duels").classList.remove("hidden");const winner=duelScores[0]===duelScores[1]?"🤝 ¡Empate!":duelScores[0]>duelScores[1]?"🏆 ¡Gana el Jugador 1!":"🏆 ¡Gana el Jugador 2!";$("duels").innerHTML='<h2>⚔️ Duelo terminado</h2><div class="notice"><b>'+winner+'</b><br>👤 Jugador 1: '+duelScores[0]+' · 👤 Jugador 2: '+duelScores[1]+'</div><button class="primary" onclick="showDuels()">🔄 Otro duelo</button>'+backButton()}
function showDuels(){hide();$("duels").classList.remove("hidden");$("duels").innerHTML='<h2>⚔️ Duelos</h2><div class="notice">Cada jugador responde 3 preguntas.</div><select id="duelCategory"><option>Matemáticas</option><option>Lengua</option><option>Ciencias</option><option>Geografía</option><option>Inglés</option><option>Historia</option><option>Cultura general</option></select><button class="primary" onclick="startDuel()">⚔️ Empezar duelo</button>'+backButton()}
function buyItem(item,cost){if(dragonItem===item){showReward('✅ Ya está equipado');return}if(coins<cost){showReward('❌ No tienes suficientes monedas');return}coins-=cost;dragonItem=item;save();showShop()}function showShop(){hide();$("shop").classList.remove("hidden");const items=[['draco','🐉 Draco','dragon-morado.png',0],['fenix','🔥 Fénix','fenix.png',250],['dragon-supremo','👑 Dragón Supremo','dragon-supremo-nuevo.png',750]];$("shop").innerHTML=`<h2>🛍️ Tienda</h2><div class="notice">🪙 ${coins} monedas</div>${items.map(x=>`<div class="item ${dragonItem===x[0]?'done':''}"><img src="${x[2]}"><b>${x[1]}</b><div class="price">${x[3]===0?'Gratis':'🪙 '+x[3]}</div>${dragonItem===x[0]?'✅ Equipado':`<button onclick="buyItem('${x[0]}',${x[3]})">${x[3]===0?'Equipar':'Comprar y equipar'}</button>`}</div>`).join('')}${backButton()}`}
function renameDragon(){const n=$('dragonNameInput').value.trim();if(n){dragonName=n;save();showDragon()}}function showParents(){hide();$("parents").classList.remove("hidden");const level=Math.floor(xp/100)+1;const accuracy=questionsAnswered?Math.round(correctAnswers/questionsAnswered*100):0;const categories=[...categoriesPlayed];$("parents").innerHTML=`<h2>👨‍👩‍👧 Zona de padres</h2><div class="notice">Aquí puedes consultar el progreso de Quizzy de forma sencilla.</div><div class="stats"><b>📊 Progreso</b><br>⭐ Nivel: <b>${level}</b><br>⭐ XP: <b>${xp}</b><br>🪙 Monedas: <b>${coins}</b></div><div class="stats"><b>📚 Actividad</b><br>❓ Preguntas respondidas: <b>${questionsAnswered}</b><br>✅ Respuestas correctas: <b>${correctAnswers}</b><br>🎯 Precisión: <b>${accuracy}%</b><br>📚 Categorías jugadas: <b>${categories.length}</b></div><div class="item"><b>🧠 Categorías utilizadas</b><br>${categories.length?categories.map(c=>`<span class="badge">${c}</span>`).join(''):'<span class="small">Todavía no hay categorías registradas.</span>'}</div><div class="notice"><b>🐉 Dragón</b><br>${dragonName} · ${dragonLabel()} · Nivel ${level}</div>${backButton()}`}
initMissions();updateMissions();updateAchievements();updateHeader();
</script>
</body>
</html>
