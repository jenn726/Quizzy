<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzy 🐉</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(145deg, #6d28d9, #a855f7);
  color: white;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.points {
  background: rgba(255,255,255,.18);
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: bold;
}

.hero {
  background: white;
  color: #333;
  border-radius: 30px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.dragon-box {
  width: 145px;
  height: 145px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: linear-gradient(145deg,#c084fc,#7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(124,58,237,.35);
}

.dragon {
  font-size: 88px;
}

h1 {
  margin: 5px 0;
  color: #6521c9;
  font-size: 34px;
}

.welcome {
  font-size: 18px;
  margin: 8px 0 18px;
}

.level {
  background: #f3e8ff;
  border-radius: 15px;
  padding: 12px;
  margin-bottom: 20px;
  color: #6420c5;
  font-weight: bold;
}

.progress {
  height: 9px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar {
  width: 35%;
  height: 100%;
  background: linear-gradient(90deg,#7c3aed,#c084fc);
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.menu button {
  border: none;
  border-radius: 20px;
  padding: 18px 8px;
  font-size: 16px;
  font-weight: bold;
  background: #f5f0ff;
  color: #5720a7;
  box-shadow: 0 4px 10px rgba(0,0,0,.08);
}

.menu button:active {
  transform: scale(.97);
}

.play {
  grid-column: 1 / 3;
  background: linear-gradient(135deg,#7c3aed,#9333ea) !important;
  color: white !important;
  font-size: 20px !important;
  padding: 20px !important;
}

.icon {
  display: block;
  font-size: 30px;
  margin-bottom: 5px;
}

.footer {
  text-align: center;
  margin-top: 18px;
  opacity: .85;
  font-size: 13px;
}

#game {
  display: none;
}

.question-card {
  background: white;
  color: #333;
  border-radius: 25px;
  padding: 25px;
  text-align: center;
}

.question {
  font-size: 21px;
  font-weight: bold;
  margin: 20px 0;
}

.answer {
  display: block;
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
  background: #f0e7ff;
  color: #4b178f;
  font-size: 17px;
  font-weight: bold;
}

.correct {
  background: #75e6a0 !important;
}

.incorrect {
  background: #ff8c8c !important;
}

.next,
.back {
  border: none;
  border-radius: 15px;
  padding: 14px 22px;
  margin-top: 15px;
  background: #7025d6;
  color: white;
  font-size: 17px;
  font-weight: bold;
